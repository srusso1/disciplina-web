services:
  postgres:
    image: postgres:16-alpine
    container_name: disciplina-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-disciplina_db}
      POSTGRES_USER: ${POSTGRES_USER:-admin_disciplina}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret_password_2026}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/01-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - disciplina-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin_disciplina} -d ${POSTGRES_DB:-disciplina_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: disciplina-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-disciplina_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-admin_disciplina}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-secret_password_2026}
      JWT_SECRET: ${JWT_SECRET:-9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SERVER_PORT: 8080
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - disciplina-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: disciplina-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - disciplina-net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: disciplina-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@disciplina.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin_disciplina_2026}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - disciplina-net

volumes:
  pgdata:
    driver: local

networks:
  disciplina-net:
    driver: bridge
