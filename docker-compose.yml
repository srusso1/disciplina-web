services:
  postgres:
    image: postgres:16-alpine
    container_name: disciplina-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-disciplina_db}
      POSTGRES_USER: ${POSTGRES_USER:-admin_disciplina}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret_password_2026}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - disciplina-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin_disciplina} -d ${POSTGRES_DB:-disciplina_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: disciplina-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@disciplina.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin_disciplina_2026}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - disciplina-net

volumes:
  pgdata:
    driver: local

networks:
  disciplina-net:
    driver: bridge