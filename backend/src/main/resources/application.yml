server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1

spring:
  application:
    name: disciplina-backend

  servlet:
    multipart:
      enabled: true
      max-file-size: 15MB
      max-request-size: 15MB

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/disciplina_db}
    username: ${SPRING_DATASOURCE_USERNAME:admin_disciplina}
    password: ${SPRING_DATASOURCE_PASSWORD:secret_password_2026}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: DisciplinaHikariCP
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    encoding: UTF-8

app:
  jwt:
    secret: ${JWT_SECRET:c2VjcmV0X3Bhc3N3b3JkX2Rpc2NpcGxpbmFfd2ViXzIwMjZfaG1hY19zaGEyNTZfc2VjdXJlX2tleV9mb3Jfand0X2F1dGhlbnRpY2F0aW9u}
    expiration-ms: ${JWT_EXPIRATION_MS:28800000}
  gemini:
    api-key: ${GEMINI_API_KEY:AQ.Ab8RN6LpeJ7yxEjT4hD6-pcHgjg7uuICFW_1yUb7Dc2Ov-e08w}
    model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
    timeout-seconds: ${GEMINI_TIMEOUT_SECONDS:8}

logging:
  level:
    com.disciplina: DEBUG
    org.springframework.security: INFO
    org.flywaydb: INFO
