server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: disciplina-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/disciplina_db}
    username: ${SPRING_DATASOURCE_USERNAME:admin_disciplina}
    password: ${SPRING_DATASOURCE_PASSWORD:secret_password_2026}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: DisciplinaHikariCP
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    encoding: UTF-8

app:
  jwt:
    secret: c2VjcmV0X3Bhc3N3b3JkX2Rpc2NpcGxpbmFfd2ViXzIwMjZfaG1hY19zaGEyNTZfc2VjdXJlX2tleV9mb3Jfand0X2F1dGhlbnRpY2F0aW9u
    expiration-ms: 28800000 # 8 horas en milisegundos

logging:
  level:
    com.disciplina: DEBUG
    org.springframework.security: INFO
    org.flywaydb: INFO
