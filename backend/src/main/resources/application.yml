server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: disciplina-backend

  servlet:
    multipart:
      enabled: true
      max-file-size: 15MB
      max-request-size: 15MB

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/disciplina_db}
    username: ${SPRING_DATASOURCE_USERNAME:${APP_DB_USER:disciplina_app}}
    # La contraseña no puede tener fallback: obligatoria en todos los entornos.
    password: ${SPRING_DATASOURCE_PASSWORD:${APP_DB_PASSWORD}}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: DisciplinaHikariCP
      # Perfil conservador para recursos limitados; todos los valores son
      # configurables por entorno para despliegues de mayor capacidad.
      maximum-pool-size: ${DB_POOL_MAX_SIZE:4}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:300000}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:10000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:3000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1200000}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    # Detecta migraciones modificadas o un esquema divergente antes de iniciar.
    validate-on-migrate: true
    locations: classpath:db/migration
    encoding: UTF-8
    user: ${SPRING_FLYWAY_USER:${POSTGRES_USER:${SPRING_DATASOURCE_USERNAME:${APP_DB_USER:disciplina_app}}}}
    password: ${SPRING_FLYWAY_PASSWORD:${POSTGRES_PASSWORD:${SPRING_DATASOURCE_PASSWORD:${APP_DB_PASSWORD}}}}

app:
  importacion:
    # Límites defensivos para archivos Excel; ajustables por entorno según RAM.
    max-rows: ${IMPORT_MAX_ROWS:10000}
    max-sheets: ${IMPORT_MAX_SHEETS:10}
  whatsapp:
    api-url: ${WHATSAPP_API_URL:https://graph.facebook.com/v25.0}
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    business-account-id: ${WHATSAPP_BUSINESS_ACCOUNT_ID:}
    webhook-verify-token: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:}
    app-secret: ${WHATSAPP_APP_SECRET:}
    template-name: ${WHATSAPP_TEMPLATE_NAME:citacion_incidente_convivencia}
    template-language: ${WHATSAPP_TEMPLATE_LANGUAGE:es_CO}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:28800000}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-1.5-flash}
    timeout-seconds: ${GEMINI_TIMEOUT_SECONDS:8}

logging:
  level:
    com.disciplina: DEBUG
    org.springframework.security: INFO
    org.flywaydb: INFO
